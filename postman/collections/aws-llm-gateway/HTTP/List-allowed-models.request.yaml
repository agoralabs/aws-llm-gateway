$kind: http-request
name: List allowed models
method: GET
url: '{{baseUrl}}/v1/models'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response body has object 'list'", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("object");
          pm.expect(json.object).to.eql("list");
      });

      pm.test("Response contains a 'data' array", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("data");
          pm.expect(json.data).to.be.an("array");
      });

      pm.test("At least one model is available", function () {
          const json = pm.response.json();
          pm.expect(json.data.length).to.be.above(0);
      });

      pm.test("Each model has an 'id' and 'object' field", function () {
          const json = pm.response.json();
          json.data.forEach(function (model) {
              pm.expect(model).to.have.property("id");
              pm.expect(model).to.have.property("object");
          });
      });

      pm.test("Response time is under 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
